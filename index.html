<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo List</title>
    <!-- Connect CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main container -->
    <div class="container">
        <!-- Page heading -->
        <h1>My Todo List</h1>

        <!-- Input for new task -->
        <input type="text" id="taskInput" placeholder="Enter a new task">

        <!-- Button to add task -->
        <button id="addBtn">Add Task</button>

        <!-- List of tasks -->
        <ul id="taskList"></ul>
    </div>

    <!-- Connect JavaScript file JavaScript -->
    <script src="script.js"></script>

</body>
</html>
